<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle (optional) -->
  <circle cx="128" cy="128" r="120" fill="#f5f5f5"/>
  
  <!-- Main logo: Flow concept with 3 connected nodes and flowing arrows -->
  <g transform="translate(128, 128)">
    <!-- Left node -->
    <circle cx="-40" cy="0" r="12" fill="#3B82F6" stroke="#1E40AF" stroke-width="2"/>
    
    <!-- Center node -->
    <circle cx="0" cy="0" r="14" fill="#1E40AF" stroke="#1E3A8A" stroke-width="2"/>
    
    <!-- Right node -->
    <circle cx="40" cy="0" r="12" fill="#3B82F6" stroke="#1E40AF" stroke-width="2"/>
    
    <!-- Flowing arrows/connectors -->
    <!-- Left to Center arrow -->
    <path d="M -28 -4 L -8 -4" stroke="#60A5FA" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <polygon points="-6,-4 -2,-6 -2,-2" fill="#60A5FA"/>
    
    <!-- Center to Right arrow -->
    <path d="M 8 -4 L 28 -4" stroke="#60A5FA" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <polygon points="30,-4 34,-6 34,-2" fill="#60A5FA"/>
    
    <!-- Additional flow lines to suggest movement -->
    <path d="M -28 4 L -8 4" stroke="#93C5FD" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 8 4 L 28 4" stroke="#93C5FD" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Small pulse/activity indicator -->
    <circle cx="0" cy="0" r="14" fill="none" stroke="#60A5FA" stroke-width="1.5" opacity="0.4">
      <animate attributeName="r" from="14" to="22" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.6" to="0" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Text version (optional, for larger displays) -->
  <text x="128" y="220" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="20" font-weight="600" text-anchor="middle" fill="#1E40AF">
    DevFlow
  </text>
</svg>