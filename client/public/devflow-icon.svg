<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="256" height="256" fill="#f5f5f5" rx="40"/>
  
  <!-- Main logo: Flow concept -->
  <g transform="translate(128, 128)">
    <!-- Left node -->
    <circle cx="-40" cy="0" r="12" fill="#3B82F6" stroke="#1E40AF" stroke-width="2"/>
    
    <!-- Center node -->
    <circle cx="0" cy="0" r="14" fill="#1E40AF" stroke="#1E3A8A" stroke-width="2"/>
    
    <!-- Right node -->
    <circle cx="40" cy="0" r="12" fill="#3B82F6" stroke="#1E40AF" stroke-width="2"/>
    
    <!-- Flowing arrows -->
    <path d="M -28 -4 L -8 -4" stroke="#60A5FA" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <polygon points="-6,-4 -2,-6 -2,-2" fill="#60A5FA"/>
    
    <path d="M 8 -4 L 28 -4" stroke="#60A5FA" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <polygon points="30,-4 34,-6 34,-2" fill="#60A5FA"/>
    
    <!-- Secondary flow lines -->
    <path d="M -28 4 L -8 4" stroke="#93C5FD" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 8 4 L 28 4" stroke="#93C5FD" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>